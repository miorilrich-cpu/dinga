<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ช่องทางการชำระเงิน ✨ Princess Shop</title>
    <!-- Google Fonts: Kanit & Itim for cute Thai text -->
    <link href="https://fonts.googleapis.com/css2?family=Itim&family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- FontAwesome สำหรับไอคอนน่ารักๆ -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #fff5f7;
            --card-bg: #ffffff;
            --primary-color: #ffb6c1;
            --secondary-color: #ffd1dc;
            --text-color: #5a4a52;
            --accent-gold: #e6c594;
            --border-radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#ffd1dc 1px, transparent 1px);
            background-size: 25px 25px;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            border: 3px solid var(--secondary-color);
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(255, 182, 193, 0.3);
            padding: 30px 20px;
            text-align: center;
            position: relative;
        }

        /* ตกแต่งกรอบสไตล์เจ้าหญิง */
        .container::before {
            content: '👑';
            font-size: 30px;
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            padding: 0 10px;
        }

        /* โลโก้ร้าน */
        .logo-container {
            margin-bottom: 20px;
        }

        .logo-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-gold);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        h1 {
            font-family: 'Itim', cursive;
            font-size: 26px;
            color: #d87093;
            margin-bottom: 5px;
        }

        p.subtitle {
            font-size: 14px;
            color: #8c7880;
            margin-bottom: 20px;
        }

        /* QR Code Section */
        .qr-box {
            background: #fff9fa;
            border: 2px dashed var(--secondary-color);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            display: inline-block;
        }

        .qr-img {
            width: 180px;
            height: 180px;
            object-fit: contain;
            border-radius: 10px;
        }

        /* Payment Info Cards */
        .info-card {
            background: #faf6f8;
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #f2e3e7;
            text-align: left;
        }

        .info-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bank-icon {
            font-size: 24px;
            color: #d87093;
            background: var(--secondary-color);
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: border-radius;
            border-radius: 50%;
        }

        .bank-details .bank-name {
            font-size: 13px;
            color: #8c7880;
        }

        .bank-details .bank-number {
            font-family: 'Itim', cursive;
            font-size: 18px;
            letter-spacing: 1px;
            color: #4a3b42;
        }

        /* ปุ่มคัดลอก */
        .copy-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Kanit', sans-serif;
            font-size: 13px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .copy-btn:hover {
            background-color: #ff9eb1;
            transform: scale(1.05);
        }

        /* กล่องข้อความพิเศษ (ยัยมิ) */
        .note-box {
            background: linear-gradient(135deg, #fff0f3, #ffe4e9);
            border: 2px solid var(--primary-color);
            border-radius: 12px;
            padding: 12px 15px;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .note-text-area {
            text-align: left;
        }

        .note-label {
            font-size: 12px;
            color: #d87093;
            font-weight: 500;
        }

        .note-content {
            font-family: 'Itim', cursive;
            font-size: 18px;
            color: #4a3b42;
        }

        /* แจ้งเตือนเมื่อคัดลอกสำเร็จ (Toast) */
        #toast {
            visibility: hidden;
            background-color: #4bb543;
            color: white;
            text-align: center;
            border-radius: 8px;
            padding: 10px 20px;
            position: fixed;
            bottom: 30px;
            font-size: 14px;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        #toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 1.5s;
        }

        @keyframes fadein {
            from { bottom: 0; opacity: 0; }
            to { bottom: 30px; opacity: 1; }
        }

        @keyframes fadeout {
            from { bottom: 30px; opacity: 1; }
            to { bottom: 0; opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- โลโก้ร้าน (เปลี่ยนลิงก์รูปภาพโลโก้ของคุณตรง src) -->
        <div class="logo-container">
            <img src="https://via.placeholder.com/90/ffb6c1/ffffff?text=LOGO" alt="Logo" class="logo-img">
            <h1>Princess Payment ✨</h1>
            <p class="subtitle">กรุณาตรวจสอบยอดเงินก่อนโอนนะคะ ♡</p>
        </div>

        <!-- รูป QR Code สำหรับสแกน -->
        <div class="qr-box">
            <!-- เปลี่ยนลิงก์รูป QR Code ของคุณตรง src -->
            <img src="https://via.placeholder.com/180/fff/d87093?text=QR+Code+PromptPay" alt="QR Code" class="qr-img">
            <p style="font-size: 12px; color: #a18a93; margin-top: 8px;"><i class="fa-solid fa-qrcode"></i> สแกนเพื่อชำระเงินผ่านพร้อมเพย์</p>
        </div>

        <!-- เลขบัญชีธนาคาร -->
        <div class="info-card">
            <div class="info-left">
                <div class="bank-icon" style="background: #e0f2fe; color: #0284c7;"><i class="fa-solid fa-building-columns"></i></div>
                <div class="bank-details">
                    <div class="bank-name">ธนาคารกสิกรไทย (KBANK)</div>
                    <div class="bank-number" id="bank-acc">123-4-56789-0</div>
                </div>
            </div>
            <button class="copy-btn" onclick="copyText('bank-acc', 'คัดลอกเลขบัญชีธนาคารแล้ว! 🌸')">
                <i class="fa-regular fa-copy"></i> คัดลอก
            </button>
        </div>

        <!-- เลขบัญชี TrueMoney Wallet -->
        <div class="info-card">
            <div class="info-left">
                <div class="bank-icon" style="background: #ffedd5; color: #ea580c;"><i class="fa-solid fa-wallet"></i></div>
                <div class="bank-details">
                    <div class="bank-name">TrueMoney Wallet</div>
                    <div class="bank-number" id="wallet-acc">081-234-5678</div>
                </div>
            </div>
            <button class="copy-btn" onclick="copyText('wallet-acc', 'คัดลอกวอเลทแล้ว! 🎀')">
                <i class="fa-regular fa-copy"></i> คัดลอก
            </button>
        </div>

        <!-- กล่องข้อความพิเศษ 'ยัยมิ' -->
        <div class="note-box">
            <div class="note-text-area">
                <div class="note-label"><i class="fa-solid fa-heart" style="color: #d87093;"></i> โน้ต/ข้อความสำหรับโอน</div>
                <div class="note-content" id="note-text">ยัยมิ</div>
            </div>
            <button class="copy-btn" onclick="copyText('note-text', 'คัดลอกข้อความ \"ยัยมิ\" แล้ว! ✨')">
                <i class="fa-regular fa-copy"></i> คัดลอก
            </button>
        </div>
    </div>

    <!-- กล่องแจ้งเตือนเมื่อคัดลอก -->
    <div id="toast">คัดลอกสำเร็จ!</div>

    <script>
        function copyText(elementId, message) {
            const textToCopy = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                showToast(message);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.className = "show";
            setTimeout(() => {
                toast.className = toast.className.replace("show", "");
            }, 2000);
        }
    </script>
</body>
</html>
